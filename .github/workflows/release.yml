name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build -- --target universal-apple-darwin

      - name: Build port-bar-mcp (aarch64-apple-darwin)
        working-directory: port-bar-mcp
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build port-bar-mcp (x86_64-apple-darwin)
        working-directory: port-bar-mcp
        run: cargo build --release --target x86_64-apple-darwin

      - name: Package port-bar-mcp npm platform binaries
        run: |
          cp port-bar-mcp/target/aarch64-apple-darwin/release/port-bar-mcp npm/port-bar-mcp-darwin-arm64/port-bar-mcp
          cp port-bar-mcp/target/x86_64-apple-darwin/release/port-bar-mcp npm/port-bar-mcp-darwin-x64/port-bar-mcp
          chmod +x npm/port-bar-mcp-darwin-arm64/port-bar-mcp npm/port-bar-mcp-darwin-x64/port-bar-mcp

      - name: Set npm package versions from Cargo.toml
        run: |
          MCP_VERSION="$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d '"' -f2)"
          echo "MCP npm package version: $MCP_VERSION"
          npm pkg set version="$MCP_VERSION" --prefix npm/port-bar-mcp-darwin-arm64
          npm pkg set version="$MCP_VERSION" --prefix npm/port-bar-mcp-darwin-x64
          npm pkg set version="$MCP_VERSION" --prefix npm/port-bar-mcp
          npm pkg set optionalDependencies.port-bar-mcp-darwin-arm64="$MCP_VERSION" --prefix npm/port-bar-mcp
          npm pkg set optionalDependencies.port-bar-mcp-darwin-x64="$MCP_VERSION" --prefix npm/port-bar-mcp

      - name: Check whether this MCP package version is already published
        run: |
          MCP_VERSION="$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d '"' -f2)"
          if npm view "port-bar-mcp@$MCP_VERSION" version >/dev/null 2>&1; then
            echo "port-bar-mcp@$MCP_VERSION is already published — skipping npm publish steps."
            echo "SKIP_MCP_NPM_PUBLISH=true" >> "$GITHUB_ENV"
          else
            echo "port-bar-mcp@$MCP_VERSION not yet published — will publish."
            echo "SKIP_MCP_NPM_PUBLISH=false" >> "$GITHUB_ENV"
          fi

      - name: Publish port-bar-mcp npm packages
        if: env.SKIP_MCP_NPM_PUBLISH == 'false'
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --access public ./port-bar-mcp-darwin-arm64
          npm publish --access public ./port-bar-mcp-darwin-x64
          npm publish --access public ./port-bar-mcp

      - name: List build artifacts (debug)
        run: find src-tauri/target -name "*.dmg" -o -name "*.app" | head -20

      - name: Add a stable-named copy for direct-download links
        working-directory: src-tauri/target/universal-apple-darwin/release/bundle/dmg
        run: cp "$(ls *.dmg | head -n1)" "Gooliya-Port-Bar.dmg"

      - name: Generate checksums
        working-directory: src-tauri/target/universal-apple-darwin/release/bundle/dmg
        run: shasum -a 256 *.dmg > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/checksums.txt
          generate_release_notes: true
