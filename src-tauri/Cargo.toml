[package]
name = "hq-app"
version = "0.2.3"
description = "A lightweight macOS menu bar app that scans local npm/Docker dev ports, with pin, rename, remove, and one-click open in browser"
authors = ["Gooliya <gooliya.dev@gmail.com>"]
edition = "2021"
# `tauri dev`/`tauri build` invoke `cargo run`/`cargo build` without `--bin`;
# adding the port-bar-mcp binary made that ambiguous, so pin the default
# explicitly to the GUI app.
default-run = "hq-app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "hq_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
window-vibrancy = "0.5"

# Only used by the standalone `port-bar-mcp` binary (src/bin/port-bar-mcp.rs),
# not by the GUI app itself. Gated behind the `mcp-server` feature (see
# [[bin]] below) so a plain `cargo build`/`tauri build` — which builds every
# binary target in the package by default, regardless of `default-run` —
# doesn't try to compile or bundle this one.
rmcp = { version = "3", features = ["server", "macros", "transport-io"], optional = true }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "io-std"], optional = true }
anyhow = { version = "1", optional = true }

[features]
mcp-server = ["dep:rmcp", "dep:tokio", "dep:anyhow"]

[[bin]]
name = "port-bar-mcp"
path = "src/bin/port-bar-mcp.rs"
required-features = ["mcp-server"]

