[package]
name = "port-bar-mcp"
version = "0.2.3"
description = "Standalone read-only MCP server for Gooliya Port Bar"
authors = ["Gooliya <gooliya.dev@gmail.com>"]
edition = "2021"

# A separate package (not a [[bin]] inside src-tauri) so that `tauri build`
# never sees this as one of the GUI app's own binary targets — Tauri
# auto-bundles every [[bin]] it finds in that package via `cargo metadata`,
# regardless of any `required-features` gating, which broke the v0.2.3
# release build. Depending on hq-app by path reuses its scan_ports() /
# PortEntry logic without duplicating it.

[dependencies]
hq-app = { path = "../src-tauri" }
serde_json = "1"
rmcp = { version = "3", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "io-std"] }
anyhow = "1"
